name: Sync Upstream Tags

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The tags pointed to releases contain .github/workflows/*, so pushing them
# with the auto-issued GITHUB_TOKEN is rejected server-side ("refusing to allow
# a GitHub App to create or update workflow"), and even when a push succeeds,
# GITHUB_TOKEN-originated push events do not trigger other workflows. Both
# problems are solved by authenticating with a fine-grained PAT that has
# "Contents: read and write" + "Workflows: read and write" on this repo, stored
# as the SYNC_GIT_TOKEN secret. PAT-originated pushes DO trigger workflows.
permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_GIT_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AxDSan/mnemosyne.git

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Push new tags to fork
        run: |
          # grep -v exits 1 when its input is empty (e.g. origin has no tags
          # yet), which under set -e -o pipefail aborts the whole step. The
          # || true guards are required, not optional.
          upstream_tags=$(git ls-remote --tags upstream \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -v '\^{}') || true
          fork_tags=$(git ls-remote --tags origin \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -v '\^{}') || true

          new_tags=()
          for tag in $upstream_tags; do
              if ! echo "$fork_tags" | grep -qx "$tag"; then
                  new_tags+=("$tag")
              fi
          done

          if [ ${#new_tags[@]} -eq 0 ]; then
              echo "No new tags to sync."
              exit 0
          fi

          echo "New tags to sync:"
          printf '  - %s\n' "${new_tags[@]}"

          for tag in "${new_tags[@]}"; do
              echo "Pushing tag: $tag"
              git push origin "$tag"
          done
